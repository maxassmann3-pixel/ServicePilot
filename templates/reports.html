{% extends "base.html" %}

{% block content %}

<div class="header">
    <div>
        <h1>Tagesbericht (Mitarbeiter)</h1>
        <p>Aktuellen Stand, gefahrene Stunden/Kilometer, Standort und Mängel erfassen.</p>
    </div>
</div>

<div class="card">
    <form method="post" enctype="multipart/form-data">

        <label>Maschine auswählen</label>
        <select name="machine_id" id="machineSelect" required onchange="showCurrentMachineInfo()">
            {% for m in machines %}
            <option value="{{ m.id }}"
                    data-location="{% if m.independent %}ortsunabhängig{% else %}{{ m.current_location }}{% endif %}"
                    data-unit="{{ m.unit }}"
                    data-type="{{ m.type }}">
                {{ m.name }} — aktuell {{ m.current_value }} {{ m.unit }}
            </option>
            {% endfor %}
        </select>

        <div class="card" style="margin-bottom:16px;">
            <strong>Aktueller Standort:</strong>
            <span id="currentLocationDisplay">—</span>
        </div>

        <label id="exactValueLabel">Aktueller Betriebsstundenstand / Kilometerstand</label>
        <input name="new_value" type="number" step="0.1" placeholder="z. B. 1250.5">

        <label>Falls Betriebsstunden/Kilometerstand nicht exakt bekannt: hier heute gefahrene Stunden/Kilometer eintragen</label>
        <input name="today_used" type="number" step="0.1" placeholder="z. B. 6 h oder 80 km">

        <small>Ein Feld von beiden muss ausgefüllt werden.</small>

        <br><br>

        <label>Standort bleibt / aktueller Standort</label>
        <select name="selected_location">
            {% for loc in locations %}
            <option value="{{ loc }}">{{ loc }}</option>
            {% endfor %}
        </select>

        <div class="checkbox-row">
            <input type="checkbox" name="location_change" id="location_change" onclick="toggleLocationChange()">
            <label>Standortwechsel</label>
        </div>

        <div id="location-change-box" style="display:none;">
            <label>zu</label>
            <select name="new_location_select">
                {% for loc in locations %}
                <option value="{{ loc }}">{{ loc }}</option>
                {% endfor %}
            </select>

            <label>oder neuen Standort eintragen</label>
            <input name="new_location_text" placeholder="Neuer Standort">
        </div>

        <div class="checkbox-row">
            <input type="checkbox" name="independent">
            <label>ortsunabhängig</label>
        </div>

        <label>Mangel / Notiz</label>
        <textarea name="note" placeholder="Einzelner Mangel / Notiz"></textarea>

        <label>Foto zum Mangel aus Galerie hochladen</label>
        <input name="note_photo_file" type="file" accept="image/*">

        <label>Priorität</label>
        <select name="priority">
            <option value="green">🟢 Grün – Hinweis</option>
            <option value="yellow">🟡 Gelb – Achtung</option>
            <option value="red">🔴 Rot – dringend beheben</option>
        </select>

        <button class="btn">Tagesbericht speichern</button>
    </form>
</div>

<script>
function showCurrentMachineInfo(){
    const select = document.getElementById("machineSelect");
    const display = document.getElementById("currentLocationDisplay");
    const label = document.getElementById("exactValueLabel");

    if(select && display){
        const selectedOption = select.options[select.selectedIndex];
        display.textContent = selectedOption.dataset.location || "—";

        if(selectedOption.dataset.type === "vehicle"){
            label.textContent = "Aktueller Kilometerstand";
        }else{
            label.textContent = "Aktueller Betriebsstundenstand";
        }
    }
}

window.addEventListener("load", function(){
    showCurrentMachineInfo();
});
</script>

{% endblock %}
