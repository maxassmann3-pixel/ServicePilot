{% extends "base.html" %}

{% block content %}

<div class="header">
    <div>
        <h1>Fuhrpark auswählen</h1>
        <p>Wähle deinen Unternehmens-Fuhrpark aus und gib das passende Passwort ein.</p>
    </div>
</div>

<div class="card-grid">
    {% for fleet in fleets %}
    <div class="card">

        {% if fleet.profile_image %}
            <img src="{{ fleet.profile_image }}" style="width:100%; max-height:160px; object-fit:cover; border-radius:18px; margin-bottom:16px;">
        {% endif %}

        <h2>{{ fleet.name }}</h2>

        <form action="/join-fleet" method="post">
            <input type="hidden" name="fleet_id" value="{{ fleet.id }}">

            <label>Fuhrpark-Passwort</label>
            <input name="fleet_password" type="password" required>

            <button class="btn">Fuhrpark betreten</button>
        </form>
    </div>
    {% endfor %}
</div>

{% endblock %}
