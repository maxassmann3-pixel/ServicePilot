<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServicePilot</title>

    <link rel="icon" href="/static/img/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div id="splash">
    <img src="/static/img/servicepilot_logo.png">
</div>

<div class="app-container">

    <aside class="sidebar">
        <img class="sidebar-logo" src="/static/img/servicepilot_logo.png">

        <div class="fleet-title">
            {{ fleet_name if fleet_name else "Fuhrpark" }}
        </div>

        <nav class="menu">
            <a class="{% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">🏠 Dashboard</a>
            <a class="{% if request.path == '/machines' %}active{% endif %}" href="/machines">🚜 Maschinen</a>
            <a class="{% if request.path == '/reports' %}active{% endif %}" href="/reports">🕒 Tagesbericht (Mitarbeiter)</a>
            <a class="{% if request.path == '/service' %}active{% endif %}" href="/service">🛠 Servicecenter (Werkstatt)</a>

            {% if session.get("admin") %}
                <a class="{% if request.path == '/settings' %}active{% endif %}" href="/settings">⚙️ Einstellungen</a>
                <a class="{% if request.path == '/admin' %}active{% endif %}" href="/admin">🔐 Admin</a>
            {% endif %}

            <a href="/logout">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

</div>

<script src="/static/js/main.js"></script>

</body>
</html>
